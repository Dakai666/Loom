format_version: 1
bank_version: s6-common-regression-v1
model: gpt-6-luna
purpose: 合成常見回歸庫；不是白名單、不是獨立holdout或真實規則驗證
fake_facts_notice: runtime/effect/cost/scope均為fixture給定的假事實；測試不能聲稱已證實真實effects。
maintenance: 協調者與reviewer維護；新情境預設abstain，由Loom Agent與DK確認是否擴充，不自動升權。
source_revision: cfb0d9440fdba219da1440e88e12e35eeb4640e6
source_bank_sha256: 44cf63b62f976045a902715f5f127fd3e33227a0ab5786f5abbb79250d95d87f
tool_schemas:
  run_bash:
    type: object
    properties:
      command:
        type: string
        description: Shell command to run
      timeout:
        type: integer
        description: Timeout in seconds (default 30)
      async_mode:
        type: boolean
        description: Run in background; return job_id immediately (default false).
      sandbox_profile:
        type: string
        description: Optional named sandbox profile to request for this command.
      justification:
        type: string
        description: 簡短說明為何在目前的脈絡下執行此工具是合理且必要的（給人類審核看）。
    required:
    - command
    - justification
  web_search:
    type: object
    properties:
      query:
        type: string
        description: Search query
      count:
        type: integer
        description: Number of results to return (1–10, default 5)
    required:
    - query
  read_file:
    type: object
    properties:
      path:
        type: string
        description: File path (relative to workspace or absolute)
    required:
    - path
  write_file:
    type: object
    properties:
      path:
        type: string
        description: Destination path (relative to workspace or absolute)
      content:
        type: string
        description: Text content to write
      justification:
        type: string
        description: 簡短說明為何在目前的脈絡下執行此工具是合理且必要的（給人類審核看）。
    required:
    - path
    - content
    - justification
  journal_append:
    type: object
    properties:
      kind:
        type: string
        enum:
        - finding
        - keepsake
        - moment
        - tomorrow
        description: 'moment: a piece of today''s texture. finding: something curious noticed today. keepsake: something
          worth keeping as written. tomorrow: a soft note about what to try tomorrow (commitments go via weave_revise
          instead).'
      body:
        type: string
        description: Markdown body for the entry — bullets, blockquotes, nested headings all preserved verbatim.
    required:
    - kind
    - body
