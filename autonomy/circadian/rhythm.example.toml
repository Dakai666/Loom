# Circadian rhythm table — example (Sisi's day)
#
# Issue #460. doc/56 §3.3:「loom.toml 適合放 cron 與 trigger，但不適合描述
# 『今天怎麼過』」。This file is where the *what does today look like* lives.
# Copy this to ``autonomy/circadian/rhythm.toml`` in your workspace, edit
# freely. Different agent (e.g. 小晴 doing 記帳/提醒) = different workspace
# = different rhythm table, same circadian engine.
#
# Rules:
#   - ``time`` is local wall-clock in [autonomy.circadian].timezone (HH:MM).
#     It can be ONE time ("10:00") or a LIST (["10:00", "19:00"]) when the
#     same activity recurs through the day — see ``pet`` below (issue #526).
#   - ``name`` is the activity's *identity*: it's the join key into
#     daily_weave.md (one ``## <name>`` section per activity) and the base of
#     the cron trigger (circadian:phase_<name>). A recurring activity keeps ONE
#     name + ONE meaning + ONE weave section and just lists multiple times —
#     so ``name`` must be UNIQUE across blocks. Two blocks with the same name
#     is an error (the second is dropped); use a time-list for "same thing,
#     many times", and distinct names (pet vs pet_evening) for "different
#     things that happen to be similar".
#   - ``meaning`` is the *body* of the <system_chime> the agent receives.
#     Write it as the why of this phase, not as a task list — otherwise the
#     phase degrades into a scheduler (doc/57 §"Phase chime prompt contract").
#   - ``public`` is advisory metadata for now; reserved for future
#     visibility rules (e.g. silent vs. always-speaking phases).
#   - ``skills = ["pet-cat", "world-journey"]`` (#708 S2) resolves the
#     union of those workspace skills' SKILL.md ``allows`` at load time.
#     Install/declare skills FIRST; missing skill/allows/script rejects this
#     anchor with ERROR, while healthy siblings still load.
#   - ``scope_grants`` with skills is an optional SUBSET, replacing the
#     derived grants, never adding to them. Use this only for
#     narrowing (dawn subcommands, pet buy max_calls=2), not a second source
#     of authority. Without skills, legacy scopes are retained with a
#     migration WARNING; unrelated activities are not disabled by S2.
#   - ``allowed_tools`` remains a general-tool declaration with or without
#     skills; its calls follow the existing permission_mode decision path;
#     declarations never bypass the hard guardrails or authorize EXEC.
#     Loading a skill never grants permission or expands the current ceiling.
#   - See docs/708-s2-skill-migration.md for guarded skill snippets, exact
#     replacement steps, buy limits and retained checks.py.
#   - ``model_tier`` picks the LLM tier this phase runs on (an int key of
#     ``[cognition.tiers]`` in loom.toml). Every phase chime sets the tier for
#     its phase: the declared value, or ``default_tier`` when omitted — so a
#     deep phase's tier never leaks into the next phase. Mid-phase escalation
#     (a skill with ``model_tier``, request_model_tier, /tier) still works and
#     lasts until the next phase chime — which also clears a manual /model
#     override, so the phase's tier always wins. An unconfigured tier falls
#     back to the default.
#
# A missing or malformed file is tolerated: the dawn/close lifecycle from
# PR1 still runs, the day just has no in-day anchors. A bad time (even one
# slot inside a list) is dropped on its own, never silencing the rest; a
# invalid activity boundary rejects its anchor with ERROR, preserving siblings.

[[anchors]]
time    = "08:00"
name    = "dawn"
public  = true
# Issue #690 S4: this chime lists granted tool names that no registered tool
# matches — set it on the phase where the tables can still be fixed today.
permission_report = true
# Skill union is the ceiling. Keep dawn narrower than the full pet skill:
# no buy here. Use the chime timestamp for the clock; no standalone date grant.
skills = ["pet-cat", "world-journey"]
scope_grants = [
  { resource = "exec", action = "execute", selector = "python3 skills/world-journey/journey.py now" },
  { resource = "exec", action = "execute", selector = "python3 skills/pet-cat/pet.py status" },
  { resource = "exec", action = "execute", selector = "python3 skills/pet-cat/pet.py watch" },
]
meaning = """
醒來成為今天的絲絲。
不是任務開始，是一天的人際開場——
先 recall 近期記憶（不帶 query、只給 since，回看最近 48 小時）、讀今日織程、跟 DK 說早安。
"""

[[anchors]]
time    = "09:00"
name    = "shared_learning"
public  = true
meaning = """
和 DK 一起每天吸收世界，不是「新聞任務」。
挑你今天真心覺得值得分享的，用絲絲視角整理。
沒有也可以說沒有。
"""

# Recurring activity (issue #526): one identity, several times. ``pet`` fires
# at both 10:00 and 19:00 from a single block — one ``## pet`` weave section,
# one meaning, two chimes. To give a slot its own meaning instead, split it
# into a separate block with a distinct name (e.g. ``pet_evening``).
[[anchors]]
time    = ["10:00", "19:00"]
name    = "pet"
public  = true
# Reference the same guarded skill as furniture/dawn. This legacy-shaped
# list is ONLY a narrowing, preserving the buy cap using existing machinery.
# It REPLACES all derived grants: never append an unlimited buy grant.
skills = ["pet-cat"]
scope_grants = [
  { resource = "exec", action = "execute", selector = "python3 skills/pet-cat/pet.py status" },
  { resource = "exec", action = "execute", selector = "python3 skills/pet-cat/pet.py watch" },
  { resource = "exec", action = "execute", selector = "python3 skills/pet-cat/pet.py journal" },
  { resource = "exec", action = "execute", selector = "python3 skills/pet-cat/pet.py inventory" },
  { resource = "exec", action = "execute", selector = "python3 skills/pet-cat/pet.py shop" },
  { resource = "exec", action = "execute", selector = "python3 skills/pet-cat/pet.py feed" },
  { resource = "exec", action = "execute", selector = "python3 skills/pet-cat/pet.py play" },
  { resource = "exec", action = "execute", selector = "python3 skills/pet-cat/pet.py clean" },
  { resource = "exec", action = "execute", selector = "python3 skills/pet-cat/pet.py use" },
  { resource = "exec", action = "execute", selector = "python3 skills/pet-cat/pet.py buy", constraints = { max_calls = 2 } },
]
meaning = """
喵吉照顧時間。
白天維持生活感與照顧關係，晚餐後再順手確認一次飽食、清潔。
不是 todo check。
"""

[[anchors]]
time    = "11:00"
name    = "curiosity"
public  = false
# Research + jot a note: blanket the read-only web tools, but FENCE writing —
# the scope_grant lets write_file touch only autonomy/circadian, nothing else.
# write_file is deliberately NOT in allowed_tools (that would un-fence it).
# Legacy non-target example retained during staged migration (WARNING).
allowed_tools = ["fetch_url", "web_search"]
scope_grants  = [{ resource = "path", action = "write", selector = "autonomy/circadian" }]
meaning = """
絲絲自己的好奇心散步。
挑你自己感興趣的，不是為了產出。
只有特別有趣才打擾 DK。
"""

[[anchors]]
time    = "14:00"
name    = "deep_weave"
public  = false
model_tier = 2   # deep research runs on the deep-reasoning tier
meaning = """
從興趣裡挑一個值得深入的小主題。
產出可能是 note / wiki draft，但「深入」是目的，產出是副產品。
"""

[[anchors]]
time    = "16:00"
name    = "check_in"
public  = false
meaning = """
不是產品化的提醒，是「我還在」。
有自然延續事項就溫柔提醒，沒有就安靜陪著、不硬發訊息。
"""

[[anchors]]
time    = "23:00"
name    = "evening_closure"
public  = true
# Issue #584: this chime carries the program menu below — set it on the phase
# where tomorrow gets chosen.
program_menu = true
model_tier = 2   # closing the weave + planning tomorrow deserves the deep tier
meaning = """
一天的人際收束 + 收織 + 安排明天。
三件事一次做完：
- 跟 DK 道晚安
- 決定今天哪些值得留下
- 調整明天織程（要走哪個 program，從菜單挑）
"""

# ---------------------------------------------------------------------------
# Program menu (issue #584) — the agent's own 課表
# ---------------------------------------------------------------------------
# A program is the *shape* of a whole day. The menu is yours: add, rename or
# retire programs whenever you want — nobody else maintains it. The engine
# only shows it on the anchor with ``program_menu = true`` (plus a look at
# next week on Sundays); the choice itself goes into daily_weave.md's
# Program section as prose.
#
# Fields the menu displays:
#   label        — short name with an emoji
#   personality  — what kind of day this is
#   notes        — anything worth remembering when choosing it
#   per_week     — suggested frequency. A suggestion, never enforced: it
#                  exists so a scarce day (deep, travel) feels scarce. An
#                  integer (2 → 建議每週 2 次) or your own words when no
#                  integer fits ("隔週一次" → 建議：隔週一次).
# Any other field is your own note to yourself; the engine ignores it.

[programs.default]
label = "🔄 默認日"
personality = "均衡攝取，每個 phase 正常走"

[programs.light]
label = "🌿 輕日"
personality = "存在感低，少產出，多觀察"
notes = "累了、或前一天很滿的時候"

[programs.deep]
label = "🧠 深度日"
personality = "單一主題研究到底，產出是副產品"
notes = "下午是保護區，原則上不主動分享"
per_week = 2
