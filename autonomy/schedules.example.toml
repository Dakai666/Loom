# Autonomy schedule registry — example (issue #444)
#
# Copy this to ``autonomy/schedules.toml`` in your workspace and edit freely.
# This file is the *work-item* surface: agents add / remove / tweak schedules
# here without ever touching ``loom.toml`` (cognition / memory / sandbox /
# harness). The master on/off switch stays in loom.toml:
#
#   [autonomy]
#   enabled = true        # <- in loom.toml, gates the whole daemon
#
# Per-agent isolation is by workspace (cwd), exactly like
# ``autonomy/circadian/rhythm.toml``: a different agent runs in a different
# workspace and sees a different registry, one shared daemon.
#
# Two table arrays:
#   [[schedules]]  — cron-fired work items
#   [[triggers]]   — event-fired work items (emitted via `loom autonomy emit`)
#
# Activity scopes now come from skills = [...] and SKILL.md allows (#708 S2).
# With skills, scope_grants can only narrow that union. allowed_tools remains
# a general-tool declaration through the existing permission-mode/hard guards.
# Without skills, legacy scopes are retained with a migration WARNING so
# unrelated activities keep running. Entries that intentionally stay legacy
# (e.g. CLI or path:read not expressible in SKILL.md allows) may set a non-empty
# ``legacy_reason = "..."`` to downgrade that WARNING to INFO (#708 S4b).
# See docs/708-s2-skill-migration.md.
# Install/update skills before adding references. Missing skill/allows/script
# rejects that entry with ERROR, preserving healthy siblings. ``cron`` strings are
# UTC (hand-convert from local time); the per-schedule ``timezone`` field is
# currently a no-op.
#
# Discord forum publishing: a schedule with no bound thread can still publish
# by creating a forum post via ``create_discord_forum_post`` (allowed_tools).
# The target forum defaults to ``DISCORD_NEWS_FORUM_ID`` in ``.env``; pass
# ``forum_channel_id`` to the tool to override. See 範例 4b below.

# ── 範例 1: 每週記憶整理（housekeeping） ─────────────────────────
[[schedules]]
name          = "memory_housekeeping"
cron          = "0 19 * * 0"            # 19:00 UTC Sunday = 03:00 Asia/Taipei Monday
intent        = """先 load_skill("memory-housekeeping")，依規程先量 corpus snapshot，
                   再預覽／清理衰減記憶，最後寫 outputs/self_check/<today>-memory-corpus.md。
                   只記工具實際回傳數字，不另外改記憶或 memorize。"""
trust_level   = "safe"
notify        = false
notify_thread = 0
# 先把 docs/examples/708-s2b/memory-housekeeping.SKILL.md 安裝至
# skills/memory-housekeeping/SKILL.md，才加入此引用；不是空殼技能。
skills        = ["memory-housekeeping"]
allowed_tools = ["write_file"]
attach_outputs = ["outputs/self_check/*-memory-corpus.md"]

# （範例 2 的每日 free dream 已隨 dream_cycle 工具退役，#639：夢交給 daemon 的
#  收斂夢／蒸餾夢排程，見 loom.toml 的 [memory.consolidation_dream] / [memory.distill_dream]。）

# ── 範例 3: weekly skill review ────────────────────────────────
[[schedules]]
name          = "skill_weekly_review"
cron          = "0 2 * * 6"             # 02:00 UTC Saturday = 10:00 Asia/Taipei
intent        = """Run plain `loom skill weekly` via run_bash, with no extra flags,
                   redirect, pipe or chaining; then read the generated report
                   with read_file and surface items in the 該關注清單."""
trust_level   = "safe"
notify        = true
notify_thread = 0
legacy_reason = "S1 allows does not cover loom CLI exec or path:read"
allowed_tools = ["run_bash", "read_file"]
scope_grants  = [
  { resource = "exec", action = "execute", selector = "loom skill weekly", constraints = { exact_argv = true, absolute_paths = "deny" } },
  { resource = "path", action = "read",    selector = "outputs"   },
]
attach_outputs = ["outputs/self_check/*-skill-weekly.md"]

# ── 範例 4: chime schedule（在既有 Discord 討論串裡發聲，而非獨立 run） ──
[[schedules]]
name          = "morning_briefing"
cron          = "0 1 * * *"
intent        = "撰寫晨報並發到討論串。"
trust_level   = "safe"
mode          = "chime"
skills        = ["news-aggregator"]
allowed_tools = ["write_file", "web_search"]

  [schedules.target]
  type     = "discord_thread"
  id       = "REPLACE_WITH_THREAD_ID"   # 部署細節（非 secret）；放本檔不入 git
  fallback = "skip"

# ── 範例 4b: 論壇發布（自建貼文，無需綁定討論串） ─────────────────
# 一般 planner 排程（非 chime），跑在 autonomy session 上。寫完文件後呼叫
# create_discord_forum_post 把「說明＋新聞文件」發成一則論壇貼文。
# 論壇預設取 .env 的 DISCORD_NEWS_FORUM_ID。
#
# 註：create_discord_forum_post 本身是 GUARDED 工具。schedule 的
# trust_level = "safe" 不會降低它的等級——autonomy session 會把 confirm 導到
# Discord notify channel 按鈕，所以發布前仍走授權（與 schedule trust level 不衝突）。
# 也因此 schedule 必須在 allowed_tools 明列它才會被授權。
[[schedules]]
name          = "news_forum_post"
cron          = "0 1 * * *"
intent        = """產製今日晨報，寫入 news/current/YYYY-MM-DD/ 後，呼叫
  create_discord_forum_post(
    title="YYYY-MM-DD 晨報",
    content=<晨報導讀摘要>,
    files=["news/current/YYYY-MM-DD/daily_briefing.md", ...其餘分軌檔],
  )
把說明文字＋新聞文件一次發成論壇貼文（forum 取 .env 預設），
再用 read_discord_forum（list 模式）確認貼文出現在論壇清單。"""
trust_level   = "safe"
skills        = ["news-aggregator"]
allowed_tools = ["write_file", "web_search", "create_discord_forum_post", "read_discord_forum"]

# ── 範例 5: event trigger（外部訊號觸發） ─────────────────────────
[[triggers]]
name          = "deploy_check"
event         = "deployment_done"        # 用 `loom autonomy emit deployment_done` 觸發
intent        = "Run smoke tests and post results."
trust_level   = "guarded"
notify        = true
notify_thread = 0
allowed_tools = ["run_bash"]
scope_grants  = [
  { resource = "exec", action = "execute", selector = "workspace" },
]
